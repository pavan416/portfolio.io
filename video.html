    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #eee;
            font-family: 'Lato', sans-serif;
        }

        /* Navbar */
        nav {
            width: 100%;
            background-color: #111;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Section Header */
        .section-header {
            text-align: center;
            margin: 0 auto;
            padding: 40px 20px 20px;
            font: 900 60px 'Lato', sans-serif;
            letter-spacing: 2px;
            color: #000;
        }

        /* Gallery Styling */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item-wrapper {
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 30%;
            min-width: 280px;
            position: relative;
        }

        .gallery-video {
            width: 100%;
            height: 500px;
            object-fit: cover;
            background-color: #000;
            cursor: pointer;
        }

        .text {
            text-align: center;
            padding: 10px;
            background-color: #111;
            color: #fff;
            font: 100 16px 'Lato', sans-serif;
        }

        .span-text {
            font-weight: 700;
            letter-spacing: 1.2px;
            font-size: 19px;
            font-family: 'Alegreya Sans SC', sans-serif;
        }

        /* Play button overlay */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.3);
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .play-overlay.hidden {
            opacity: 0;
        }

        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #111;
        }

        /* Responsive Behavior */
        @media (max-width: 900px) {
            .gallery-item-wrapper {
                width: 45%;
            }

            .gallery-video {
                height: 400px;
            }

            .play-overlay {
                height: 400px;
            }
        }

        @media (max-width: 600px) {
            .gallery-item-wrapper {
                width: 100%;
            }

            .gallery-video {
                height: 350px;
            }

            .play-overlay {
                height: 350px;
            }
        }
    </style>
</head>

    <script>
        const allVideos = document.querySelectorAll('.gallery-video');
        
        allVideos.forEach(video => {
            const wrapper = video.closest('.gallery-item-wrapper');
            const overlay = wrapper.querySelector('.play-overlay');
            
            // When a video starts playing, pause all other videos
            video.addEventListener('play', () => {
                allVideos.forEach(otherVideo => {
                    if (otherVideo !== video && !otherVideo.paused) {
                        otherVideo.pause();
                    }
                });
                overlay.classList.add('hidden');
            });
            
            video.addEventListener('pause', () => {
                overlay.classList.remove('hidden');
            });
            
            video.addEventListener('ended', () => {
                overlay.classList.remove('hidden');
            });
        });
    </script>
